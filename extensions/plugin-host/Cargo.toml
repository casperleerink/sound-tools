[package]
name = "plugin-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# The scan's child process for this crate's tests.
[[bin]]
name = "plugin-scan"
path = "src/bin/plugin-scan.rs"

[dependencies]
anyhow.workspace = true
clack-extensions = { workspace = true, features = [
  "clack-host",
  "audio-ports",
  "gui",
  "latency",
  "note-ports",
  "params",
  "render",
  "state",
] }
clack-host.workspace = true
dunce.workspace = true
gpui.workspace = true
raw-window-handle.workspace = true
rtrb.workspace = true
rtsan-standalone.workspace = true
serde.workspace = true
serde_json.workspace = true
sound-core.workspace = true
sound-notes.workspace = true
sound-ui.workspace = true
thiserror.workspace = true
vst3.workspace = true

# A plugin in a process of its own, see src/bridge.
[target.'cfg(unix)'.dependencies]
audio_thread_priority.workspace = true
libc.workspace = true
memmap2.workspace = true
no_denormals.workspace = true

# The plugin's own window in its own process, see src/bridge/windows.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
smol.workspace = true

# Real-time priority through rtkit, as cpal gets it, see crates/core/Cargo.toml.
[target.'cfg(target_os = "linux")'.dependencies]
audio_thread_priority = { workspace = true, features = ["with_dbus"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
test-clap-plugin.workspace = true
test-plugin-support.workspace = true
test-vst3-plugin.workspace = true
