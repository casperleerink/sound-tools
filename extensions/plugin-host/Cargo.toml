[package]
name = "plugin-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# The child process that scans one bundle. The runtime uses its own executable for this; the
# tests of this crate use the binary, so they need no runtime.
[[bin]]
name = "clap-scan"
path = "src/bin/clap-scan.rs"

[dependencies]
clack-extensions = { workspace = true, features = [
  "clack-host",
  "audio-ports",
  "gui",
  "note-ports",
  "state",
] }
clack-host.workspace = true
gpui.workspace = true
rtsan-standalone.workspace = true
serde.workspace = true
serde_json.workspace = true
sound-core.workspace = true
sound-notes.workspace = true
sound-ui.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
test-clap-plugin.workspace = true
