name: Release

# A tag v<version> builds the app for macOS, Linux and Windows and makes a GitHub release of it.
# Started by hand, it builds the same files and keeps them as artifacts of the run, with no
# release: the dry run. `/release` makes the tag, see .agents/skills/release/SKILL.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Cargo.toml holds the version. A tag that says another one is a mistake.
      - name: Check the tag against Cargo.toml
        id: version
        run: |
          version="$(tooling/version.sh)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $version in Cargo.toml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Apple silicon only. There is no Intel build.
  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: tooling/bundle-macos.sh --zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/Sound-Tools-${{ needs.version.outputs.version }}-macos-arm64.zip
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      matrix:
        include:
          # 24.04 on both: the glibc of the runner is the oldest the program runs with.
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev libclang-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libvulkan1 unzip
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: tooling/bundle-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/sound-tools-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # x86_64 only. There is no build for Windows on Arm.
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install the pinned Inno Setup
        run: choco install innosetup --version 6.7.1 --allow-downgrade --no-progress --yes
      - run: tooling/bundle-windows.sh
      # Nobody here has a Windows computer, so the runner tries the setup program as the app's
      # own update runs it: an install, an update over a running Bun, and the uninstall.
      - name: Try the setup program
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          setup() { "dist/Sound-Tools-Setup-$VERSION.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART; }
          on_path() {
            powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path', 'User')" \
              | grep -qF 'Programs\Sound Tools'
          }
          folder="$(cygpath "$LOCALAPPDATA")/Programs/Sound Tools"
          shortcut="$(cygpath "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Sound Tools.lnk"

          setup
          "$folder/sound-tools.exe" --version
          test -f "$shortcut"
          on_path

          "$folder/bun.exe" -e 'setTimeout(() => {}, 600000)' &
          bun=$!
          sleep 2
          setup
          test -f "$folder/bun.exe.old"
          "$folder/bun.exe" --version
          kill "$bun"
          wait "$bun" || true

          "$folder/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          # The uninstaller hands over to a copy of itself and may return before that is done.
          for _ in $(seq 30); do
            [[ -e "$folder" ]] || break
            sleep 1
          done
          if [[ -e "$folder" || -e "$shortcut" ]] || on_path; then
            echo "::error::The uninstall left something behind."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/Sound-Tools-Setup-${{ needs.version.outputs.version }}.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The app checks its update against this file. See crates/runtime/src/update.rs.
      - name: Write the checksums
        run: cd dist && sha256sum -- *.zip *.tar.gz *.exe > SHA256SUMS
      # The fixed install notes come first, then the notes GitHub writes from the pull requests.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          **macOS** (Apple silicon, macOS 11 or later): unzip `Sound-Tools-*-macos-arm64.zip` and drag `Sound Tools.app` to Applications. The app is not signed by a known developer, so macOS blocks the first open. Run this once in a terminal:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/Sound Tools.app"
          ```

          Or try to open it once, then click **Open Anyway** in System Settings, Privacy & Security.

          **Updates**: the app checks for a new release when it opens and every day while it stays open, downloads it in the background and offers **Restart** to install it. On macOS the new build is signed ad hoc too, so macOS may ask for microphone access again after an update.

          **Linux** (x86_64 or aarch64): extract the tarball for your machine and run its `install.sh`. It puts the app in `~/.local`, with a menu entry and the `sound-tools` command.

          ```sh
          tar -xzf sound-tools-*-linux-*.tar.gz
          cd sound-tools-*-linux-*/
          ./install.sh
          ```

          It needs glibc 2.39 or later: Ubuntu 24.04, Debian 13, Fedora 40 or newer. It also needs ALSA, PipeWire, D-Bus, Vulkan (a graphics driver, or Mesa for a software one), xkbcommon, fontconfig and Wayland or X11, which a desktop mostly has. On Ubuntu or Debian: `sudo apt-get install libasound2t64 libpipewire-0.3-0t64 libdbus-1-3 libvulkan1 mesa-vulkan-drivers libxkbcommon-x11-0 libwayland-client0 libx11-xcb1 libfontconfig1`.

          **Windows** (x86_64, Windows 10 or later): run `Sound-Tools-Setup-*.exe`. It installs the app for your user, with no administrator, adds it to the Start menu and puts the `sound-tools` command on your `PATH`. To remove it, use Settings, Apps. The setup is not signed, so Windows SmartScreen may block it: click **More info**, then **Run anyway**.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Sound Tools $VERSION" --notes-file notes.md --generate-notes
