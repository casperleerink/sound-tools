name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install

      # Warnings fail CI only. The parent folder config merges with .cargo/config.toml for every cargo command.
      - name: Deny warnings
        run: mkdir -p ../.cargo && cp .cargo/ci-config.toml ../.cargo/config.toml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> /private/tmp/sound-tools-timing/target"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-shear,cargo-deny,typos

      - run: cargo fmt --all --check
      - run: typos
      - run: cargo clippy --workspace --all-targets --locked
      # Before the tests: they load the repository's own CLAP and VST 3 plugins, which are
      # dynamic libraries that `cargo test` does not build.
      - run: cargo build --workspace --locked
      - run: cargo nextest run --workspace --locked
      - name: Render gallery snapshots
        run: cargo test -p gallery --test snapshots --locked
      - name: Render window snapshots
        run: cargo test -p runtime --test snapshots --locked
      - run: cargo shear
      - run: cargo deny check

      # Last, because the variable rebuilds the audio crates. The sanitizer aborts any test that
      # allocates, locks or makes a system call inside Engine::process_block.
      - name: Realtime sanitizer
        run: |
          cargo nextest run -p sound-core -p tone -p instrument -p filter -p reverb -p sound-notes -p arrangement -p metronome -p midi -p plugin-host --locked
          # Real projects: the sequencer of every track into its synth, with live file edits,
          # a whole recording from the MIDI input into a clip, and tracks whose instrument is
          # a hosted CLAP or VST 3 plugin.
          cargo nextest run -p runtime --test projects --locked
        env:
          RTSAN_ENABLE: 1
