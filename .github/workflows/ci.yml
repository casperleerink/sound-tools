name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Three jobs run side by side. Each builds what it needs and keeps its own cache. Only main saves
# the caches, so pull requests do not push main's out of the 10 GB limit. A change that only
# touches `docs/` runs the lint job and skips the others.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # True when any changed file is outside docs/.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'

  lint:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Warnings fail CI only. The parent folder config merges with .cargo/config.toml for every cargo command.
      - name: Deny warnings
        run: mkdir -p ../.cargo && cp .cargo/ci-config.toml ../.cargo/config.toml
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear,cargo-deny,typos
      - run: cargo fmt --all --check
      - run: typos
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo shear
      - run: cargo deny check

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Deny warnings
        run: mkdir -p ../.cargo && cp .cargo/ci-config.toml ../.cargo/config.toml
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Before the tests: they load the repository's own CLAP and VST 3 plugins, which are
      # dynamic libraries that `cargo test` does not build.
      - run: cargo build -p test-clap-plugin -p test-vst3-plugin --locked
      # With the realtime sanitizer on: any test that allocates, locks or makes a system call
      # inside Engine::process_block aborts.
      - run: cargo nextest run --workspace --locked
        env:
          RTSAN_ENABLE: 1

  # Linux builds and runs the tests.
  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libvulkan1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Deny warnings
        run: mkdir -p ../.cargo && cp .cargo/ci-config.toml ../.cargo/config.toml
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo build -p test-clap-plugin -p test-vst3-plugin --locked
      - run: cargo nextest run --workspace --locked

  # Windows builds, lints and runs the tests. Nobody here has a Windows computer, so this job is
  # how Windows-only failures show up.
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Deny warnings
        run: mkdir -p ../.cargo && cp .cargo/ci-config.toml ../.cargo/config.toml
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo build -p test-clap-plugin -p test-vst3-plugin --locked
      - run: cargo nextest run --workspace --locked --no-fail-fast
