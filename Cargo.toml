[workspace]
members = ["crates/ui", "crates/gallery"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# Zed stable v1.20.2. Keep the rev and rust-toolchain.toml in step with Zed's pin.
gpui = { git = "https://github.com/zed-industries/zed", rev = "7c451e694f3c52ee0aeb01d7e28b5fa18cd0ad2f" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7c451e694f3c52ee0aeb01d7e28b5fa18cd0ad2f", features = ["runtime_shaders", "font-kit"] }
sound-ui = { path = "crates/ui" }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 0
