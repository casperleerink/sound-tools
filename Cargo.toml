[workspace]
members = ["crates/agent", "crates/core", "crates/media", "crates/notes", "crates/signals", "crates/runtime", "crates/typescript", "crates/ui", "crates/gallery", "extensions/arrangement", "extensions/compressor", "extensions/delay", "extensions/drum-pad", "extensions/eq", "extensions/filter", "extensions/fit-tempo", "extensions/instrument", "extensions/limiter", "extensions/metronome", "extensions/midi", "extensions/modulation", "extensions/plugin-host", "extensions/reverb", "extensions/sampler", "extensions/saturator", "extensions/tone", "extensions/utility", "extensions/wavetable", "tooling/test-clap-plugin", "tooling/test-plugin-support", "tooling/test-vst3-plugin", "tooling/workspace-rules"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.7.0"
publish = false

# Every dependency, internal or external, is declared here once. Members write `foo.workspace = true`.
[workspace.dependencies]
# Zed stable v1.20.2. Keep the rev and rust-toolchain.toml in step with Zed's pin.
# `wayland` and `x11` are the window systems of Linux. Without them Linux opens no window.
gpui = { git = "https://github.com/zed-industries/zed", rev = "7c451e694f3c52ee0aeb01d7e28b5fa18cd0ad2f" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7c451e694f3c52ee0aeb01d7e28b5fa18cd0ad2f", features = ["runtime_shaders", "font-kit", "wayland", "x11"] }
arrangement = { path = "extensions/arrangement" }
compressor = { path = "extensions/compressor" }
delay = { path = "extensions/delay" }
drum-pad = { path = "extensions/drum-pad" }
eq = { path = "extensions/eq" }
filter = { path = "extensions/filter" }
fit-tempo = { path = "extensions/fit-tempo" }
instrument = { path = "extensions/instrument" }
limiter = { path = "extensions/limiter" }
metronome = { path = "extensions/metronome" }
midi = { path = "extensions/midi" }
modulation = { path = "extensions/modulation" }
plugin-host = { path = "extensions/plugin-host" }
reverb = { path = "extensions/reverb" }
sampler = { path = "extensions/sampler" }
saturator = { path = "extensions/saturator" }
test-clap-plugin = { path = "tooling/test-clap-plugin" }
test-plugin-support = { path = "tooling/test-plugin-support" }
test-vst3-plugin = { path = "tooling/test-vst3-plugin" }
sound-agent = { path = "crates/agent" }
sound-core = { path = "crates/core" }
sound-media = { path = "crates/media" }
sound-notes = { path = "crates/notes" }
sound-signals = { path = "crates/signals" }
sound-typescript = { path = "crates/typescript" }
sound-ui = { path = "crates/ui" }
tone = { path = "extensions/tone" }
utility = { path = "extensions/utility" }
wavetable = { path = "extensions/wavetable" }
anyhow = "1"
cargo_metadata = "0.23"
# FLAC samples of instrument libraries, decoded whole on the control side. Apache-2.0.
claxon = "0.4.3"
# CLAP hosting, and the test plugin the repository builds for CI. MIT OR Apache-2.0.
clack-extensions = "0.2"
clack-host = "0.2"
clack-plugin = "0.2"
# `realtime`: the audio thread plays at real-time priority on Windows. macOS gives it that
# without asking; Linux needs more, see crates/core/Cargo.toml.
cpal = { version = "0.18", features = ["realtime"] }
# The chat example of the agent crate: ctrl-c stops the turn instead of the program.
ctrlc = "3.5"
# The icon of the Windows program, in crates/runtime/build.rs. The version gpui uses. MIT.
embed-resource = "3.0.11"
# `canonicalize` without the `\\?\` prefix Windows adds, which cmd, Explorer and people do not
# read. The same as std elsewhere.
dunce = "1.0.5"
hound = "3.5"
memmap2 = "0.9.11"
image = { version = "0.25", default-features = false, features = ["png"] }
# Snapshots of what the agent driver makes of recorded runs.
insta = "1.48"
# Ends the agent's process group, so its own children stop with it.
libc = "0.2"
# MIDI devices and messages. wmidi parses without allocating, so it is safe next to the engine.
midir = "0.11"
no_denormals = "0.3"
# Raw events. The project groups them itself, see ARCHITECTURE.md "Project storage".
notify = "8.2"
# macOS: the Core Audio process taps that hear other apps. The versions cpal uses. MIT.
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
proptest = "1"
# The agent's answers are markdown. Only the parser: no HTML output, no command line. MIT.
pulldown-cmark = { version = "0.13.4", default-features = false }
# The spectra of the Wavetable synth's tables, worked out on the control side. MIT.
realfft = "3.5"
# The `NSView` of a GPUI window, which a plugin embeds its own view in. Same version as gpui.
raw-window-handle = "0.6"
rtrb = "0.4"
# Does nothing unless the build sets RTSAN_ENABLE=1. See ENGINEERING.md section 3.
rtsan-standalone = "0.3"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps key order stable, so agent diffs of project files stay small.
serde_json = { version = "1", features = ["preserve_order"] }
# Errors name the field, such as `state.gain`, so an agent can fix its edit.
serde_path_to_error = "0.1"
# Checks the agent CLI the app downloads against its pinned checksum. MIT OR Apache-2.0.
sha2 = { version = "0.11", default-features = false }
# The async runtime under gpui's executors. The agent's child process and its pipes.
smol = "2"
tempfile = "3"
thiserror = "2"
triple_buffer = "9"
# Claude session ids, which the app picks.
uuid = { version = "1", features = ["v4", "v5"] }
# Windows: the job object that ends the agent with every program it started, and hidden
# console windows. Each crate picks its features.
windows-sys = "0.61"
# VST 3 hosting: raw COM bindings generated from the SDK headers. We write the safe layer.
# The bindings ship with the crate, so no copy of the SDK is needed to build.
vst3 = "0.3"
wmidi = "4"

# A `pub` item no other crate can reach is private in fact. Saying so shows what is unused.
[workspace.lints.rust]
unreachable_pub = "warn"

# Deny a short list of real mistakes. Allow the style group so agents do not fight style lints.
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
declare_interior_mutable_const = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
debug = 0
# Off: the incremental cache was more than half of a build folder, and every worktree has its own.
incremental = false
codegen-units = 16

# Build scripts and proc macros use the same settings, so shared crates compile once.
[profile.dev.build-override]
debug = 0
codegen-units = 16

# Fast proc macros make derive-heavy extension builds faster. Fast layout and SVG keep debug UI usable.
# Every crate with DSP code also gets opt-level 3: unoptimized audio glitches and hides real problems.
[profile.dev.package]
syn = { opt-level = 3 }
quote = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
serde_derive = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
# The shapes of waveforms and curves are tessellated on every paint of them.
lyon_tessellation = { opt-level = 3 }
lyon_path = { opt-level = 3 }
lyon_geom = { opt-level = 3 }
# Decodes FLAC samples of SFZ instruments when they load.
claxon = { opt-level = 3 }
arrangement = { opt-level = 3 }
compressor = { opt-level = 3 }
delay = { opt-level = 3 }
drum-pad = { opt-level = 3 }
eq = { opt-level = 3 }
filter = { opt-level = 3 }
fit-tempo = { opt-level = 3 }
instrument = { opt-level = 3 }
limiter = { opt-level = 3 }
metronome = { opt-level = 3 }
midi = { opt-level = 3 }
modulation = { opt-level = 3 }
plugin-host = { opt-level = 3 }
reverb = { opt-level = 3 }
runtime = { opt-level = 3 }
sampler = { opt-level = 3 }
saturator = { opt-level = 3 }
sound-core = { opt-level = 3 }
sound-media = { opt-level = 3 }
sound-notes = { opt-level = 3 }
sound-signals = { opt-level = 3 }
test-clap-plugin = { opt-level = 3 }
test-vst3-plugin = { opt-level = 3 }
tone = { opt-level = 3 }
utility = { opt-level = 3 }
wavetable = { opt-level = 3 }
# The FFT of the wavetables runs in the behaviour when a table is picked. Unoptimized it takes
# a large part of a second.
realfft = { opt-level = 3 }
rustfft = { opt-level = 3 }
# Writing a PNG of the window, in the snapshots and the screenshot example: unoptimized it
# takes most of a second.
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
flate2 = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
crc32fast = { opt-level = 3 }
adler2 = { opt-level = 3 }

[profile.dbg]
inherits = "dev"
debug = "full"

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

# For profiling audio without thin-LTO link times.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
debug = "full"
