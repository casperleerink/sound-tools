[profile.default]
slow-timeout = { period = "60s", terminate-after = 1 }
# The tests that start the system's file watcher run in CI, `--profile ci`: on a Mac where
# other builds run, the system drops file events for minutes and is slow to start a watcher.
default-filter = """
not test(=watching::the_watcher_applies_a_burst_of_files_and_skips_own_writes)
- test(=waiting::the_watcher_sees_an_asset_folder_made_after_the_project_opened)
- test(=tools::a_change_of_a_file_a_tool_imports_changes_its_sound)
"""

[profile.ci]
default-filter = "all()"
# The Windows runner is three to four times slower than the others: a test that starts the app
# twice takes over a minute there.
slow-timeout = { period = "60s", terminate-after = 3 }

# A shared runner has a slow second now and then, which a timing test meets about one run in
# ten. It runs again: a real slowdown fails each time.
[[profile.ci.overrides]]
filter = "test(/budget|within_two_milliseconds|sixty_four_lanes/)"
retries = 2
