[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[advisories]
ignore = [
  # Unmaintained, no known flaw. Only the local time at the top of each session of the app's log.
  { id = "RUSTSEC-2026-0543", reason = "chrono, for the log's local time" },
  # Unmaintained, through Rune's accessibility on Linux. Re-check when the Rune pin moves.
  { id = "RUSTSEC-2026-0370", reason = "zvariant, through Rune on Linux" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names, through Rune on Linux" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, through Rune on Linux" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # File-level copyleft. Fine as an unmodified dependency.
  "MPL-2.0",
  # Boost: permissive. clipboard-win, through Rune on Windows.
  "BSL-1.0",
  # Public domain dedications. notify 8; midly.
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8

# Our own crates are not published and have no licence field yet.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Rune with the forks it pins.
[sources.allow-org]
github = ["anomalyco"]
