[package]
name = "sound-media"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
claxon.workspace = true
hound.workspace = true
memmap2.workspace = true
realfft.workspace = true
rtrb.workspace = true
schemars.workspace = true
serde.workspace = true
sound-core.workspace = true
sound-dsp.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-av-foundation = { workspace = true, features = ["std", "AVAsset", "AVAssetImageGenerator", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-core-media = { workspace = true, features = ["std", "CMTime"] }
objc2-foundation = { workspace = true, features = ["std", "NSError", "NSString", "NSURL"] }

[dev-dependencies]
serde_json.workspace = true
