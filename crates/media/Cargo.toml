[package]
name = "sound-media"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
claxon.workspace = true
hound.workspace = true
memmap2.workspace = true
realfft.workspace = true
rtrb.workspace = true
schemars.workspace = true
serde.workspace = true
sound-core.workspace = true
sound-dsp.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-av-foundation = { workspace = true, features = ["std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "objc2-core-foundation", "objc2-core-media"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes", "CFString"] }
objc2-core-media = { workspace = true, features = ["std", "CMSampleBuffer", "CMTime", "CMTimeRange", "objc2-core-video"] }
objc2-core-video = { workspace = true, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue"] }

[dev-dependencies]
serde_json.workspace = true
