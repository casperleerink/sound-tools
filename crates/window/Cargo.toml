[package]
name = "sound-window"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# rune-kit draws the shell, which comes next.
[package.metadata.cargo-shear]
ignored = ["rune-kit"]

[[bin]]
name = "sound-tools"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dunce.workspace = true
plugin-host.workspace = true
rune.workspace = true
rune-kit.workspace = true
runtime = { path = "../runtime" }
serde.workspace = true
serde_json.workspace = true
sound-core.workspace = true
sound-typescript.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[build-dependencies]
embed-resource.workspace = true
