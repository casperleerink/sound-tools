[package]
name = "runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# What `tooling/perf/ui.py` measures the window with: gpui's frame and view timings, its
# allocation counter and the real text system. It rebuilds gpui, so `cargo verify` never sets it.
perf = ["gpui/bench-support", "dep:bench_metrics", "dep:criterion", "dep:gpui_apple"]

[dependencies]
analyzer.workspace = true
anyhow.workspace = true
bench_metrics = { workspace = true, optional = true }
chrono.workspace = true
criterion = { workspace = true, optional = true }
compressor.workspace = true
delay.workspace = true
drum-pad.workspace = true
dunce.workspace = true
eq.workspace = true
filter.workspace = true
gate.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
hound.workspace = true
instrument.workspace = true
limiter.workspace = true
metronome.workspace = true
midi.workspace = true
modulation.workspace = true
pitch-correction.workspace = true
plugin-host.workspace = true
reverb.workspace = true
sampler.workspace = true
saturator.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
sound-agent.workspace = true
sound-core.workspace = true
sound-history.workspace = true
sound-media.workspace = true
sound-notes.workspace = true
sound-typescript.workspace = true
sound-ui.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tone.workspace = true
utility.workspace = true
vocoder.workspace = true
wavetable.workspace = true

# `--screenshot` draws the window offscreen, which gpui offers under `test-support` and on
# macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_apple = { workspace = true, optional = true }
gpui_platform = { workspace = true, features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[build-dependencies]
embed-resource.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
sound-typescript = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
sha2.workspace = true
test-clap-plugin.workspace = true
test-plugin-support.workspace = true
test-vst3-plugin.workspace = true

# Renders the window offscreen. It runs on the main thread (no test harness), because the Metal
# renderer and the text system need it.
[[test]]
name = "snapshots"
harness = false
