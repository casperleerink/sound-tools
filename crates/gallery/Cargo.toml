[package]
name = "gallery"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
sound-ui.workspace = true

[dev-dependencies]
anyhow.workspace = true
