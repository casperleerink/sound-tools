[package]
name = "sound-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cpal.workspace = true
dunce.workspace = true
no_denormals.workspace = true
notify.workspace = true
rtrb.workspace = true
rtsan-standalone.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
triple_buffer.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc2.workspace = true
objc2-core-audio = { workspace = true, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFDictionary"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSDictionary", "NSObject", "NSString", "NSUUID", "NSValue"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
