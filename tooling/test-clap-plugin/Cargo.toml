[package]
name = "test-clap-plugin"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# A CLAP plugin is a dynamic library. `rlib` as well, so `cargo test` and clippy see the crate
# like any other and the tests of the plugin host can name it as a dependency for its path.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clack-extensions = { workspace = true, features = [
  "clack-plugin",
  "audio-ports",
  "note-ports",
  "state",
] }
clack-plugin.workspace = true
