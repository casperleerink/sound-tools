[files]
# The agent fixtures are recorded output of the `claude` CLI, with ids and signatures.
extend-exclude = ["experiments/*/results", "*.svg", "Cargo.lock", "crates/agent/tests/fixtures/claude/*.jsonl"]

[default.extend-identifiers]
PNGs = "PNGs"
# Claude Code marks its own notes in an error list with `[ede_diagnostic]`.
ede_diagnostic = "ede_diagnostic"

[default.extend-words]
# A peak in the spectrum of a voice, which makes a vowel.
formant = "formant"
